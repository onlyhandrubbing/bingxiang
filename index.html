<title>冰箱救援｜冰箱剩菜 15 分鐘料理・省錢計算</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: a phone-sized kitchen app — fridge door to pick, one recipe card at a time, piggy bank for savings. Tab bar at the bottom. */
:root{
  --tile:#f4efe6; --tile-line:#e7dfd1; --ink:#2b2622; --muted:#7a6f64;
  --fridge:#bfe3d6; --fridge-deep:#8cc7b2; --fridge-ink:#1f4a3d;
  --paper:#fffdf8; --egg:#ffd34d; --egg-ink:#3a2b00; --tomato:#e8503a; --tomato-ink:#fff; --leaf:#3c8c5a;
  --shadow:0 2px 0 rgba(43,38,34,.08),0 10px 24px -14px rgba(43,38,34,.45);
  --f-hand:"Huninn","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --tile:#1c1a18; --tile-line:#262321; --ink:#f2ece4; --muted:#a99e92;
  --fridge:#24453b; --fridge-deep:#33604f; --fridge-ink:#d9f3e8;
  --paper:#2a2622; --egg:#f2c33a; --egg-ink:#2a1f00; --tomato:#f0624c; --tomato-ink:#1d0703; --leaf:#6cc48d;
  --shadow:0 2px 0 rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.9); color-scheme:dark}}
:root[data-theme="dark"]{
  --tile:#1c1a18; --tile-line:#262321; --ink:#f2ece4; --muted:#a99e92;
  --fridge:#24453b; --fridge-deep:#33604f; --fridge-ink:#d9f3e8;
  --paper:#2a2622; --egg:#f2c33a; --egg-ink:#2a1f00; --tomato:#f0624c; --tomato-ink:#1d0703; --leaf:#6cc48d;
  --shadow:0 2px 0 rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.9); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  background-color:var(--tile);
  background-image:linear-gradient(var(--tile-line) 2px,transparent 2px),linear-gradient(90deg,var(--tile-line) 2px,transparent 2px);
  background-size:56px 56px}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tomato);outline-offset:2px}
.hand{font-family:var(--f-hand)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.logo{font-family:var(--f-hand);font-size:24px;display:flex;align-items:center;gap:8px}
.logo .m{width:34px;height:42px;border-radius:9px;background:var(--fridge);border:2.5px solid var(--ink);position:relative}
.logo .m::before{content:"";position:absolute;left:0;right:0;top:13px;height:2.5px;background:var(--ink)}
.logo .m::after{content:"";position:absolute;right:5px;top:4px;width:3px;height:6px;border-radius:2px;background:var(--ink);box-shadow:0 14px 0 var(--ink)}
.pig{display:flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:4px 12px 4px 8px;font-family:var(--f-hand);font-size:16px;cursor:pointer}
.pig b{color:var(--tomato);font-weight:400}
.gear{border:0;background:transparent;font-size:22px;cursor:pointer;padding:4px}
/* fridge */
.fridge{background:var(--fridge);border:3px solid var(--ink);border-radius:28px;padding:18px 16px 22px;position:relative;box-shadow:var(--shadow)}
.fridge::after{content:"";position:absolute;right:-3px;top:40px;width:10px;height:80px;border-radius:8px 0 0 8px;background:var(--ink)}
.fridge h1{font-family:var(--f-hand);font-weight:400;font-size:30px;line-height:1.2;margin:0 0 4px;color:var(--fridge-ink);text-wrap:balance}
.fridge p{margin:0 0 12px;color:var(--fridge-ink);opacity:.8;font-size:14px}
.search{width:100%;font:inherit;padding:10px 14px;border-radius:14px;border:2.5px solid var(--ink);background:var(--paper);color:var(--ink);margin-bottom:12px}
.shelf{display:flex;flex-wrap:wrap;gap:10px;padding:12px 4px 14px;border-bottom:3px solid var(--fridge-deep);margin-bottom:6px}
.shelf:last-child{border-bottom:0}
.shelf-label{font-size:12px;letter-spacing:.12em;color:var(--fridge-ink);font-weight:700;margin-top:6px}
.more{border:0;background:transparent;color:var(--fridge-ink);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px 2px;font-size:14px}
.st{border:2px solid var(--ink);background:var(--paper);border-radius:14px;padding:6px 10px 6px 6px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;box-shadow:0 2px 0 var(--ink);transform:rotate(var(--r,0deg));transition:transform .15s,background .15s;position:relative;font-size:15px}
.st:active{transform:rotate(var(--r,0deg)) translateY(2px);box-shadow:none}
.st .e{font-size:22px;line-height:1;width:28px;height:28px;display:grid;place-items:center}
.st .e.txt{font-size:13px;font-weight:900;border-radius:8px;background:var(--fridge);color:var(--fridge-ink)}
.st.on{background:var(--egg);color:var(--egg-ink)}
.st.hot{background:var(--tomato);color:var(--tomato-ink)}
.st.hot::after{content:"快壞了";position:absolute;top:-10px;right:-8px;font-size:10px;font-weight:900;background:var(--ink);color:var(--paper);border-radius:6px;padding:0 5px;transform:rotate(8deg)}
.tip{font-size:13px;color:var(--fridge-ink);opacity:.85;margin-top:8px}
/* tray */
.tray{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:12;display:flex;justify-content:center;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tray-in{pointer-events:auto;max-width:448px;width:100%;background:var(--ink);color:var(--paper);border-radius:20px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 12px 30px -10px rgba(0,0,0,.6)}
.tray .picked{flex:1;min-width:0;display:flex;gap:2px;font-size:22px;overflow:hidden;white-space:nowrap}
.tray .picked .txt{font-size:12px;font-weight:900;background:var(--fridge);color:var(--fridge-ink);border-radius:6px;padding:2px 4px;align-self:center}
.go{border:0;background:var(--egg);color:var(--egg-ink);font-family:var(--f-hand);font-size:18px;border-radius:14px;padding:10px 16px;cursor:pointer;white-space:nowrap}
.go:disabled{opacity:.5;cursor:default}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:13;background:var(--paper);border-top:2.5px solid var(--ink);display:flex;justify-content:center;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:480px;width:100%;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{border:0;background:transparent;padding:8px 0 10px;cursor:pointer;display:grid;justify-items:center;gap:0;font-size:12px;color:var(--muted)}
.tab span{font-size:22px;line-height:1.2}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700}
.tab[aria-selected="true"] span{transform:translateY(-2px) scale(1.12)}
/* deck */
.backrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.link{border:0;background:transparent;cursor:pointer;color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:6px 0}
.have{font-size:14px;color:var(--muted)}
.deck{position:relative;min-height:440px;touch-action:pan-y}
.card{position:absolute;inset:0 0 auto 0;background:var(--paper);border:3px solid var(--ink);border-radius:24px;padding:18px 18px 20px;box-shadow:var(--shadow);display:grid;gap:12px;transition:transform .25s ease,opacity .25s}
.card.behind{transform:translateY(12px) rotate(2.5deg) scale(.97);z-index:0}
.card.behind2{transform:translateY(22px) rotate(-2deg) scale(.94);z-index:-1}
.card.front{z-index:2}
.plate{height:150px;border-radius:50%;width:150px;margin:0 auto;background:radial-gradient(circle at 50% 50%,var(--paper) 52%,var(--tile-line) 53%,var(--tile-line) 60%,var(--paper) 61%);border:3px solid var(--ink);position:relative}
.plate i{position:absolute;font-style:normal;font-size:40px;line-height:1}
.plate i.txt{font-size:15px;font-weight:900;background:var(--fridge);color:var(--fridge-ink);border-radius:8px;padding:3px 6px}
.card h2{font-family:var(--f-hand);font-weight:400;font-size:32px;line-height:1.15;margin:0;text-align:center}
.facts{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;font-size:13px}
.facts span{border:2px solid var(--ink);border-radius:999px;padding:1px 10px}
.facts .hotf{background:var(--tomato);color:var(--tomato-ink);border-color:var(--tomato)}
.facts .miss{border-style:dashed}
.stamp{position:absolute;top:14px;right:14px;width:76px;height:76px;border:3px solid var(--tomato);border-radius:50%;color:var(--tomato);display:grid;place-items:center;text-align:center;transform:rotate(-14deg);font-family:var(--f-hand);line-height:1}
.stamp small{font-size:11px;display:block}.stamp b{font-weight:400;font-size:24px;display:block}
.card .note{font-size:13px;color:var(--muted);text-align:center;margin:0}
.card .note a{color:var(--leaf);font-weight:700}
.btns{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.btn{border:2.5px solid var(--ink);background:var(--paper);border-radius:16px;padding:11px 12px;font-family:var(--f-hand);font-size:18px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.red{background:var(--tomato);color:var(--tomato-ink)}
.btn.egg{background:var(--egg);color:var(--egg-ink)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--tile-line);border:1.5px solid var(--ink)}
.dots i.on{background:var(--ink)}
.empty{background:var(--paper);border:3px dashed var(--ink);border-radius:24px;padding:24px;text-align:center}
.empty h2{font-family:var(--f-hand);font-weight:400;margin:0 0 6px}
/* cook */
.cook{background:var(--paper);border:3px solid var(--ink);border-radius:24px;padding:20px;display:grid;gap:14px;box-shadow:var(--shadow)}
.cook h2{font-family:var(--f-hand);font-weight:400;font-size:28px;margin:0}
.prog{height:8px;border-radius:6px;background:var(--tile-line);overflow:hidden}.prog i{display:block;height:100%;background:var(--leaf);transition:width .3s}
.stepno{font-family:var(--f-hand);font-size:18px;color:var(--muted)}
.steptext{font-size:22px;line-height:1.5;font-weight:500;min-height:4.5em}
.chiplist{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.chiplist span{background:var(--tile);border-radius:8px;padding:1px 8px}
/* week & bank */
.panel{display:grid;gap:14px}
.sheet{background:var(--paper);border:3px solid var(--ink);border-radius:24px;padding:18px;display:grid;gap:12px;box-shadow:var(--shadow)}
.sheet h1{font-family:var(--f-hand);font-weight:400;font-size:28px;margin:0;line-height:1.2}
.sheet p{margin:0;color:var(--muted);font-size:14px}
.seg{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg .lab{font-size:14px;color:var(--muted);width:4.5em}
.pill{border:2px solid var(--ink);background:var(--paper);border-radius:999px;padding:4px 14px;cursor:pointer;font-size:15px}
.pill[aria-pressed="true"]{background:var(--egg);color:var(--egg-ink);font-weight:700}
.daygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,130px),1fr));gap:10px}
.day{background:var(--tile);border-radius:14px;padding:10px;display:grid;gap:2px;transform:rotate(var(--r,0deg))}
.day small{font-family:var(--f-hand);color:var(--muted)}
.day b{font-size:15px;line-height:1.3}
.day span{font-size:12px;color:var(--muted)}
.shop{display:grid;gap:2px}
.shop label{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:7px 2px;border-bottom:2px dotted var(--tile-line);font-size:15px;cursor:pointer}
.shop input{width:20px;height:20px;accent-color:var(--leaf)}
.shop input:checked+span{text-decoration:line-through;color:var(--muted)}
.shop .p{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.shop a{color:var(--leaf);font-weight:700;font-size:13px}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.big3 div{background:var(--tile);border-radius:14px;padding:8px 4px}
.big3 b{display:block;font-family:var(--f-hand);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.big3 small{font-size:11px;color:var(--muted)}
.shoplinks{display:flex;flex-wrap:wrap;gap:8px}
.shoplinks a{font-size:13px;text-decoration:none;border:2px solid var(--ink);border-radius:999px;padding:3px 12px;color:var(--ink);background:var(--paper)}
.fine{font-size:11.5px;color:var(--muted);margin:0}
.piggy{display:grid;justify-items:center;gap:4px;padding:6px 0 4px;text-align:center}
.piggy svg{width:170px;height:auto}
.piggy .amt{font-family:var(--f-hand);font-size:48px;line-height:1;color:var(--tomato)}
.piggy small{color:var(--muted)}
.log{display:grid;gap:4px;font-size:14px;max-height:220px;overflow:auto}
.log div{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:4px 0;border-bottom:2px dotted var(--tile-line)}
.log .p{color:var(--tomato);font-variant-numeric:tabular-nums}
.shareimg{display:grid;justify-items:center;gap:6px}
.shareimg img{max-width:min(100%,300px);border-radius:12px;border:2px solid var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.coin{position:fixed;z-index:30;font-size:34px;pointer-events:none;animation:drop 0.9s ease-in forwards}
@keyframes drop{0%{transform:translate(0,0) scale(1.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:.2}}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:14px;font-weight:700;z-index:40;max-width:calc(100% - 32px);text-align:center}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{max-width:480px;width:100%;border-radius:24px 24px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.pop{animation:pop .3s ease-out}
@keyframes pop{0%{transform:scale(.9);opacity:.3}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="logo"><span class="m" aria-hidden="true"></span>冰箱救援</div>
    <div style="display:flex;align-items:center;gap:6px">
      <button class="pig" id="pigBtn" type="button" aria-label="打開存錢筒">🐷 本月省 <b id="pigAmt">0</b> 元</button>
      <button class="gear" id="gearBtn" type="button" aria-label="設定">⚙️</button>
    </div>
  </header>

  <!-- TODAY: pick -->
  <section id="v-pick">
    <div class="fridge">
      <h1>冰箱裡還剩什麼？</h1>
      <p>點你有的東西，快壞掉的再點一下。</p>
      <input class="search" id="q" type="search" placeholder="找食材，例如：豆腐" autocomplete="off" aria-label="找食材">
      <div id="shelves"></div>
    </div>
  </section>

  <!-- TODAY: deck -->
  <section id="v-deck" hidden>
    <div class="backrow"><button class="link" id="backPick" type="button">← 改食材</button><span class="have" id="haveTxt"></span></div>
    <div class="deck" id="deck"></div>
    <div class="dots" id="dots"></div>
  </section>

  <!-- TODAY: cook -->
  <section id="v-cook" hidden>
    <div class="backrow"><button class="link" id="backDeck" type="button">← 換一道</button><span class="have" id="cookTime"></span></div>
    <div class="cook">
      <h2 id="cookName"></h2>
      <div class="chiplist" id="cookIng"></div>
      <div class="prog"><i id="cookProg"></i></div>
      <div class="stepno" id="stepNo"></div>
      <div class="steptext" id="stepText" aria-live="polite"></div>
      <div class="btns"><button class="btn" id="prevStep" type="button">上一步</button><button class="btn egg" id="nextStep" type="button">下一步</button></div>
    </div>
  </section>

  <!-- WEEK -->
  <section id="v-week" class="panel" hidden>
    <div class="sheet">
      <h1>這週不想再丟菜</h1>
      <p>先把冰箱的用完，再買「一樣能煮好幾天」的。</p>
      <div class="seg"><span class="lab">煮幾天</span><span id="wDays" class="seg"></span></div>
      <div class="seg"><span class="lab">幾個人</span><span id="wPpl" class="seg"></span></div>
      <button class="btn red" id="wGo" type="button">幫我排這週</button>
    </div>
    <div id="wOut" class="panel"></div>
  </section>

  <!-- BANK -->
  <section id="v-bank" class="panel" hidden>
    <div class="sheet">
      <div class="piggy">
        <svg viewBox="0 0 200 140" aria-hidden="true"><ellipse cx="100" cy="80" rx="70" ry="52" fill="#f7a8a0" stroke="currentColor" stroke-width="5"/><circle cx="150" cy="70" r="20" fill="#f7a8a0" stroke="currentColor" stroke-width="5"/><circle cx="146" cy="68" r="3" fill="currentColor"/><circle cx="156" cy="68" r="3" fill="currentColor"/><circle cx="125" cy="55" r="5" fill="currentColor"/><path d="M78 30 h40" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><path d="M60 125 v10 M85 128 v10 M120 128 v10 M140 124 v10" stroke="currentColor" stroke-width="7" stroke-linecap="round"/><path d="M38 70 q-18 -8 -10 -22" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg>
        <small id="bankMonth"></small>
        <span class="amt" id="bankAmt">0</span>
        <small>元便當錢留在口袋</small>
      </div>
      <div class="big3"><div><b id="bMeals">0</b><small>在家煮</small></div><div><b id="bRescue">0</b><small>救回食材（元）</small></div><div><b id="bAll">0</b><small>累計省下（元）</small></div></div>
      <div class="log" id="log"></div>
      <div class="row"><button class="btn red" id="shareBtn" type="button">做成分享圖</button><button class="btn" id="copyBtn" type="button">複製戰績</button></div>
      <div class="shareimg" id="shareBox" hidden><img id="shareImg" alt="本月省錢戰績"><span class="fine">長按或右鍵存圖，貼到 IG、Threads、LINE</span></div>

  $('haveTxt').textContent=`${[...sel].map(icoT).join('')} → ${deck.length} 道`;
  d.innerHTML='';[2,1,0].forEach(k=>{const m=deck[(di+k)%deck.length];if(k>0&&deck.length<=k)return;const el=document.createElement('article');el.className='card '+(k===0?'front pop':k===1?'behind':'behind2');el.innerHTML=k===0?cardHTML(m):'';if(k===0)el.setAttribute('aria-label',m.r[0]);d.appendChild(el)});
  const front=d.querySelector('.front');d.style.minHeight=front.offsetHeight+30+'px';
  front.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;if(a.dataset.act==='next')next(1);else startCook(deck[di])});
  swipe(front);
  $('dots').innerHTML=deck.slice(0,Math.min(deck.length,10)).map((_,i)=>`<i class="${i===di%10?'on':''}"></i>`).join('')}
function next(dir){di=(di+dir+deck.length)%deck.length;drawDeck()}
function swipe(el){let x0=null,dx=0;el.addEventListener('pointerdown',e=>{if(e.target.closest('button,a'))return;x0=e.clientX;el.setPointerCapture(e.pointerId);el.style.transition='none'});
  el.addEventListener('pointermove',e=>{if(x0==null)return;dx=e.clientX-x0;el.style.transform=`translateX(${dx}px) rotate(${dx/20}deg)`});
  const end=()=>{if(x0==null)return;el.style.transition='';x0=null;if(Math.abs(dx)>80){next(dx<0?1:-1)}else el.style.transform='';dx=0};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}
$('backPick').addEventListener('click',()=>show('pick'));

/* ---------- cook ---------- */
let cur=null,si=0;
function startCook(m){cur=m;si=0;show('cook');$('cookName').textContent=m.r[0];$('cookTime').textContent=`⏱ ${m.r[3]} 分鐘`;
  $('cookIng').innerHTML=[...m.r[1],...m.r[2].filter(n=>sel.has(n))].map(n=>`<span>${icoT(n)} ${n}</span>`).join('');drawStep()}
function drawStep(){const st=cur.r[4];$('stepNo').textContent=`第 ${si+1} 步，共 ${st.length} 步`;$('stepText').textContent=st[si];$('cookProg').style.width=((si+1)/st.length*100)+'%';
  $('prevStep').disabled=si===0;$('nextStep').textContent=si===st.length-1?`煮好了！存 ${money(cur).saved} 元`:'下一步'}
$('prevStep').addEventListener('click',()=>{if(si>0){si--;drawStep()}});
$('nextStep').addEventListener('click',e=>{if(si<cur.r[4].length-1){si++;drawStep();return}
  const mo=money(cur);ledger.unshift({d:new Date().toISOString(),n:cur.r[0],s:mo.saved,r:mo.rescued});ledger=ledger.slice(0,300);LS.set('fr_ledger',ledger);
  cur.used.forEach(n=>{sel.delete(n);exp.delete(n)});save();coins(e.target);drawPig();
  toast(`存進 ${mo.saved} 元！用掉的食材已從冰箱拿掉`);setTimeout(()=>{show('pick');drawShelves();drawTray()},900)});
$('backDeck').addEventListener('click',()=>show('deck'));
function coins(from){const a=from.getBoundingClientRect(),b=$('pigBtn').getBoundingClientRect();for(let i=0;i<5;i++){const c=document.createElement('div');c.className='coin';c.textContent='🪙';c.style.left=a.left+a.width/2+(i-2)*14+'px';c.style.top=a.top+'px';c.style.setProperty('--dx',(b.left-a.left-a.width/2)+'px');c.style.setProperty('--dy',(b.top-a.top)+'px');c.style.animationDelay=i*70+'ms';document.body.appendChild(c);setTimeout(()=>c.remove(),1200)}}

/* ---------- week ---------- */
let wDays=LS.get('fr_wdays',5),wPpl=LS.get('fr_wppl',1),lastPlan='';
const PF={1:1,2:1.8,4:3.4},CAP=n=>['雞蛋','白飯','青蔥'].includes(n)?2:1;
function pills(id,vals,get,set,f){const box=$(id);box.innerHTML=vals.map(v=>`<button class="pill" type="button" data-v="${v}" aria-pressed="${get()===v}">${f(v)}</button>`).join('');box.onclick=e=>{const b=e.target.closest('.pill');if(!b)return;set(+b.dataset.v);pills(id,vals,get,set,f)}}
pills('wDays',[3,5,7],()=>wDays,v=>{wDays=v;LS.set('fr_wdays',v)},v=>v+' 天');
pills('wPpl',[1,2,4],()=>wPpl,v=>{wPpl=v;LS.set('fr_wppl',v)},v=>v+' 人');
function plan(){const f=PF[wPpl]||1;const fu={};sel.forEach(n=>fu[n]=0);const bought={},used=new Set(),days=[];
  for(let d=0;d<wDays;d++){let best=null,bs=-1e9;
    for(const r of R){if(used.has(r[0]))continue;const[,need,opt]=r;let sc=Math.random()*0.6;
      for(const n of need){if(n in fu&&fu[n]<CAP(n))sc+=fu[n]===0?(exp.has(n)?6:4):2;else if(bought[n]&&bought[n].left>0)sc+=2.5;else sc-=(PRICE[n]||20)/12}
      for(const n of opt)if((n in fu&&fu[n]<CAP(n))||(bought[n]&&bought[n].left>0))sc+=0.5;
      const last=days.slice(-2).flatMap(x=>x.r[1]);sc-=need.filter(n=>last.includes(n)).length*0.8;
      if(sc>bs){bs=sc;best=r}}
    if(!best)break;used.add(best[0]);const buy=[];
    for(const n of best[1]){if(n in fu&&fu[n]<CAP(n)){fu[n]++;continue}if(bought[n]&&bought[n].left>0){bought[n].left--;continue}
      if(!bought[n])bought[n]={qty:0,cost:0,left:0};bought[n].qty++;bought[n].cost+=Math.round((PRICE[n]||20)*f);bought[n].left=1;buy.push(n)}
    days.push({r:best,buy})}
  const cost=Object.values(bought).reduce((s,b)=>s+b.cost,0),out=bento*wPpl*days.length,saved=Math.max(0,out-cost);
  const W=['一','二','三','四','五','六','日'];
  $('wOut').innerHTML=`<div class="sheet pop"><div class="big3"><div><b>${cost}</b><small>這週要買（元）</small></div><div><b>${out}</b><small>吃外面要（元）</small></div><div><b style="color:var(--tomato)">${saved}</b><small>省下（元）</small></div></div>
    <div class="daygrid">${days.map((d,i)=>`<div class="day" style="--r:${(i%3-1)*0.8}deg"><small>星期${W[i]}</small><b>${d.r[0]}</b><span>${d.r[3]} 分・${d.buy.length?'買 '+d.buy.join('、'):'冰箱就有'}</span></div>`).join('')}</div>
    <div class="row"><button class="btn red" id="wAgain" type="button">換一組</button><button class="btn" id="wCopy" type="button">傳到 LINE</button></div></div>
    ${Object.keys(bought).length?`<div class="sheet"><h1 style="font-size:22px">🛒 採買清單</h1><p>${wPpl} 人份，買完打勾</p><div class="shop">${Object.entries(bought).map(([n,b])=>`<label><input type="checkbox"><span>${icoT(n)} ${n}${b.qty>1?' ×'+b.qty:''}</span><span class="p">${b.cost} 元</span><a href="${buyUrl(n)}" target="_blank" rel="noopener sponsored">線上買</a></label>`).join('')}</div></div>`:'<div class="sheet"><p>冰箱裡的就夠煮完，這週不用採買 🎉</p></div>'}
    <div class="sheet"><p>讓菜放久一點</p><div class="shoplinks">${CONFIG.gear.map(([l,q])=>`<a href="${buyUrl(q)}" target="_blank" rel="noopener sponsored">${l}</a>`).join('')}</div><p class="fine">連結可能含推薦分潤，你的價格不受影響。</p></div>`;
  lastPlan=`🧊 這週剩食菜單（${wPpl} 人）\n`+days.map((d,i)=>`星期${W[i]}：${d.r[0]}`).join('\n')+`\n\n🛒 要買：${Object.keys(bought).join('、')||'不用買'}（約 ${cost} 元）\n💰 比吃外面省 ${saved} 元\n\n你也排一份：${CONFIG.siteUrl}`;
  $('wAgain').onclick=plan;$('wCopy').onclick=()=>copy(lastPlan,'已複製，貼到 LINE 家庭群組吧');
  $('wGo').textContent='重新排'}
$('wGo').addEventListener('click',plan);

/* ---------- bank ---------- */
function monthSum(){const now=new Date();let s=0,r=0,c=0;ledger.forEach(e=>{const d=new Date(e.d);if(d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()){s+=e.s;r+=e.r;c++}});return{s,r,c}}
function drawPig(){const m=monthSum();$('pigAmt').textContent=m.s;$('bankAmt').textContent=m.s;$('bankMonth').textContent=`${new Date().getMonth()+1} 月`;
  $('bMeals').textContent=m.c;$('bRescue').textContent=m.r;$('bAll').textContent=ledger.reduce((a,e)=>a+e.s,0);
  $('log').innerHTML=ledger.length?ledger.slice(0,40).map(e=>{const d=new Date(e.d);return`<div><span>${d.getMonth()+1}/${d.getDate()}</span><span>${e.n}</span><span class="p">+${e.s}</span></div>`}).join(''):'<p class="fine" style="text-align:center">還是空的。煮完一道按「煮好了」，錢就會掉進來。</p>'}
function copy(t,msg){if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast(msg)).catch(()=>toast('複製不了，請手動複製'));else toast('複製不了，請手動複製')}
$('copyBtn').addEventListener('click',()=>{const m=monthSum();copy(`這個月在家煮了 ${m.c} 餐，省下 ${m.s} 元便當錢，還救回 ${m.r} 元差點過期的食材 🐷\n冰箱剩什麼點一點就有菜：${CONFIG.siteUrl}`,'已複製')});
let armed=0;$('resetBtn').addEventListener('click',e=>{if(Date.now()-armed<3000){ledger=[];LS.set('fr_ledger',ledger);drawPig();e.target.textContent='清除紀錄';toast('紀錄已清除');return}armed=Date.now();e.target.textContent='再按一次就清掉';setTimeout(()=>e.target.textContent='清除紀錄',3000)});
$('shareBtn').addEventListener('click',()=>{const m=monthSum(),W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  g.fillStyle='#f4efe6';g.fillRect(0,0,W,H);g.strokeStyle='#e7dfd1';g.lineWidth=4;for(let x=0;x<W;x+=84){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(let y=0;y<H;y+=84){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
  g.fillStyle='#fffdf8';g.strokeStyle='#2b2622';g.lineWidth=8;rr(g,90,120,W-180,H-260,48);g.fill();g.stroke();
  g.fillStyle='#2b2622';g.textAlign='center';g.font='900 58px "Noto Sans TC",sans-serif';g.fillText(`我 ${new Date().getMonth()+1} 月在家煮了 ${m.c} 餐`,W/2,270);
  g.font='120px serif';g.fillText('🐷',W/2,450);
  g.fillStyle='#e8503a';g.font='900 190px "Noto Sans TC",sans-serif';g.fillText(String(m.s),W/2,690);
  g.fillStyle='#2b2622';g.font='700 48px "Noto Sans TC",sans-serif';g.fillText('元便當錢留在口袋',W/2,770);
  g.fillStyle='#7a6f64';g.font='500 38px "Noto Sans TC",sans-serif';g.fillText(`還救回 ${m.r} 元差點過期的食材`,W/2,850);
  ledger.slice(0,3).forEach((e,i)=>{g.fillText(`・${e.n}  +${e.s}`,W/2,940+i*56)});
  g.fillStyle='#2b2622';g.font='700 36px "Noto Sans TC",sans-serif';g.fillText('冰箱救援｜冰箱剩什麼點一點就有菜',W/2,H-80);
  $('shareImg').src=c.toDataURL('image/png');$('shareBox').hidden=false;$('shareBox').scrollIntoView({behavior:'smooth',block:'center'})});
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

/* ---------- settings ---------- */
$('gearBtn').addEventListener('click',()=>{$('settings').hidden=false});
$('closeSet').addEventListener('click',()=>{$('settings').hidden=true;drawTray()});
$('settings').addEventListener('click',e=>{if(e.target.id==='settings')$('settings').hidden=true});
pills('bentoSeg',[100,120,150],()=>bento,v=>{bento=v;LS.set('fr_bento',v)},v=>v+' 元');
function drawStaples(){$('stapleSeg').innerHTML=STAPLES.map(s=>`<button class="pill" type="button" data-s="${s}" aria-pressed="${staplesOn.has(s)}">${s}</button>`).join('')}
$('stapleSeg').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;const s=b.dataset.s;staplesOn.has(s)?staplesOn.delete(s):staplesOn.add(s);save();drawStaples()});drawStaples();

/* ---------- views ---------- */
let tab='today',sub='pick';
function show(v){sub=v;['pick','deck','cook'].forEach(k=>$('v-'+k).hidden=!(tab==='today'&&k===v));$('tray').hidden=!(tab==='today'&&v==='pick');window.scrollTo({top:0})}
function setTab(t){tab=t;['today','week','bank'].forEach(k=>$('t-'+k).setAttribute('aria-selected',k===t));$('v-week').hidden=t!=='week';$('v-bank').hidden=t!=='bank';show(sub);if(t==='bank')drawPig()}
['today','week','bank'].forEach(k=>$('t-'+k).addEventListener('click',()=>setTab(k)));
$('pigBtn').addEventListener('click',()=>setTab('bank'));
let tt;function toast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(tt);tt=setTimeout(()=>$('toast').hidden=true,2400)}

/* ads only when configured on your own domain */
if(CONFIG.adsense.client){try{const sc=document.createElement('script');sc.async=true;sc.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client='+CONFIG.adsense.client;sc.crossOrigin='anonymous';document.head.appendChild(sc);
  const ad=document.createElement('div');ad.className='sheet';ad.innerHTML=`<ins class="adsbygoogle" style="display:block" data-ad-client="${CONFIG.adsense.client}" data-ad-slot="${CONFIG.adsense.slot}" data-ad-format="auto" data-full-width-responsive="true"></ins>`;$('v-bank').appendChild(ad);(window.adsbygoogle=window.adsbygoogle||[]).push({})}catch(e){}}

drawShelves();drawTray();drawPig();show('pick');
})();
</script>
